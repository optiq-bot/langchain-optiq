[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-optiq"
version = "0.1.0"
description = "LangChain chat model for OptiQ Cloud"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "OptiQ" }]
keywords = ["langchain", "optiq", "chat", "llm", "glm", "deepseek", "minimax"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.1.0,<2.0.0",
]

[project.urls]
Homepage = "https://mlx-optiq.com"
Documentation = "https://mlx-optiq.com/docs/cloud/api"
"Source Code" = "https://github.com/optiq-bot/langchain-optiq"
repository = "https://github.com/optiq-bot/langchain-optiq"

[dependency-groups]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.2,<1.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "langchain-tests>=1.0.0,<2.0.0",
]
lint = ["ruff>=0.5"]
typing = ["mypy>=1.10,<2.0"]

[tool.hatch.build.targets.sdist]
include = ["langchain_optiq", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = ["compile: placeholder used to compile integration tests without running them"]
asyncio_mode = "auto"
